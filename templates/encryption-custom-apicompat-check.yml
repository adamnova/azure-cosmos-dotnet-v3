# API Compatibility Check Template
# Checks for breaking API changes against a baseline version

parameters:
  - name: BaselineVersion
    type: string
    default: '1.0.0-preview07'
  - name: StrictMode
    type: boolean
    default: false
  - name: BuildConfiguration
    type: string
    default: 'Release'

steps:
  - checkout: self
    clean: true
    displayName: 'Checkout Source'

  - task: UseDotNet@2
    displayName: 'Use .NET 8.0 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.x'

  - task: PowerShell@2
    displayName: 'Install ApiCompat Tool'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "Installing Microsoft.DotNet.ApiCompat.Tool..." -ForegroundColor Yellow
        dotnet tool install --global Microsoft.DotNet.ApiCompat.Tool --version 8.0.* 2>&1 | Out-Null
        
        if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Tool installed successfully" -ForegroundColor Green
        } else {
            Write-Host "Tool may already be installed, checking..." -ForegroundColor Yellow
            $installed = dotnet tool list --global | Select-String "microsoft.dotnet.apicompat.tool"
            if ($installed) {
                Write-Host "✅ Tool already installed" -ForegroundColor Green
            } else {
                Write-Error "Failed to install ApiCompat tool"
            }
        }
      pwsh: true

  - task: DotNetCoreCLI@2
    displayName: 'Restore NuGet Packages'
    inputs:
      command: 'restore'
      projects: 'Microsoft.Azure.Cosmos.Encryption.Custom/src/Microsoft.Azure.Cosmos.Encryption.Custom.csproj'
      feedsToUse: 'config'
      nugetConfigPath: 'NuGet.config'

  - task: DotNetCoreCLI@2
    displayName: 'Build Current Version'
    inputs:
      command: 'build'
      projects: 'Microsoft.Azure.Cosmos.Encryption.Custom/src/Microsoft.Azure.Cosmos.Encryption.Custom.csproj'
      arguments: '--configuration ${{ parameters.BuildConfiguration }} --no-restore'

  - task: PowerShell@2
    displayName: 'Run API Compatibility Check'
    inputs:
      filePath: 'tools/apicompat-check.ps1'
      arguments: >-
        -BaselineVersion "${{ parameters.BaselineVersion }}"
        ${{ eq(parameters.StrictMode, true) && '-Strict' || '' }}
      pwsh: true
      failOnStderr: false
      errorActionPreference: 'continue'
    continueOnError: ${{ eq(parameters.StrictMode, false) }}

  - task: PowerShell@2
    displayName: 'Generate API Compatibility Report'
    inputs:
      targetType: 'inline'
      script: |
        # Create artifacts directory
        $artifactDir = "$(Build.ArtifactStagingDirectory)/ApiCompatReport"
        New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
        
        # Determine status based on previous step
        $status = if ($env:AGENT_JOBSTATUS -eq 'Succeeded' -or $env:AGENT_JOBSTATUS -eq 'SucceededWithIssues') { 'PASSED' } else { 'FAILED' }
        $statusIcon = if ($status -eq 'PASSED') { '✅' } else { '❌' }
        
        # Create detailed text report
        $reportPath = "$artifactDir/api-compat-summary.txt"
        $report = @"
        API Compatibility Check Report
        ===============================
        Baseline Version: ${{ parameters.BaselineVersion }}
        Current Build: $(Build.BuildNumber)
        Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
        Strict Mode: ${{ parameters.StrictMode }}
        
        Status: $statusIcon $status
        
        $(if ($status -eq 'PASSED') {
            "No breaking API changes detected. The current build is compatible with version ${{ parameters.BaselineVersion }}."
        } else {
            "Breaking API changes were detected. Review pipeline logs for details."
        })
        
        For detailed results, see pipeline logs.
        
        Tool Used: Microsoft.DotNet.ApiCompat.Tool (v8.0)
        
        Next Steps (if failed):
        -----------------------
        1. Review the breaking changes in pipeline logs
        2. Determine if changes are intentional
        3. Document in docs/compatibility-testing/API-CHANGES.md
        4. Add suppressions to Microsoft.Azure.Cosmos.Encryption.Custom/ApiCompatSuppressions.txt if needed
        5. Update baseline version if this is a new major/minor release
        
        Generated by: Azure DevOps Pipeline
        "@
        
        $report | Out-File $reportPath -Encoding UTF8
        
        # Create Markdown report for GitHub integration
        $markdownPath = "$artifactDir/api-compat-report.md"
        $markdownReport = @"
        # API Compatibility Check Report
        
        **Status:** $statusIcon **$status**  
        **Baseline Version:** ${{ parameters.BaselineVersion }}  
        **Build Number:** $(Build.BuildNumber)  
        **Build Date:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')  
        **Strict Mode:** ${{ parameters.StrictMode }}
        
        ---
        
        ## Summary
        
        $(if ($status -eq 'PASSED') {
            "✅ **No breaking API changes detected**`n`nThe current build is API-compatible with version **${{ parameters.BaselineVersion }}**. All public APIs remain consistent with the baseline version."
        } else {
            "❌ **Breaking API changes detected**`n`n⚠️ The current build introduces breaking changes compared to version **${{ parameters.BaselineVersion }}**. These changes may affect consumers of the library."
        })
        
        ## Tool Information
        
        - **Tool:** Microsoft.DotNet.ApiCompat.Tool (v8.0)
        - **Analysis Type:** Binary API Compatibility
        - **Comparison:** Current build vs. NuGet package v${{ parameters.BaselineVersion }}
        
        ## What This Checks
        
        The API Compatibility tool verifies:
        - Public API surface remains stable
        - No removal of public types, methods, or properties
        - No breaking signature changes
        - Consistency with semantic versioning principles
        
        $(if ($status -eq 'FAILED') {
            "## Action Required`n`n" +
            "The detected changes require attention:`n`n" +
            "1. **Review Changes:** Examine the pipeline logs for specific API changes`n" +
            "2. **Assess Impact:** Determine if changes are intentional and necessary`n" +
            "3. **Document:** Update ``docs/compatibility-testing/API-CHANGES.md`` with details`n" +
            "4. **Suppress if Needed:** Add suppressions to ``Microsoft.Azure.Cosmos.Encryption.Custom/ApiCompatSuppressions.txt`` for acceptable changes`n" +
            "5. **Version Update:** Consider updating the baseline version for major/minor releases`n`n" +
            "### Resources`n`n" +
            "- [API Compatibility Documentation](https://github.com/dotnet/arcade/blob/main/Documentation/ApiCompat.md)`n" +
            "- [Semantic Versioning](https://semver.org/)"
        })
        
        ---
        
        *Generated by Azure DevOps Compatibility Testing Pipeline*  
        *For detailed results, review the full pipeline logs.*
        "@
        
        $markdownReport | Out-File $markdownPath -Encoding UTF8
        
        # Create JSON report for programmatic consumption
        $jsonPath = "$artifactDir/api-compat-result.json"
        $jsonReport = @{
            status = $status
            baselineVersion = "${{ parameters.BaselineVersion }}"
            buildNumber = "$(Build.BuildNumber)"
            buildDate = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
            strictMode = [bool]"${{ parameters.StrictMode }}"
            tool = "Microsoft.DotNet.ApiCompat.Tool"
            toolVersion = "8.0"
        } | ConvertTo-Json -Depth 3
        
        $jsonReport | Out-File $jsonPath -Encoding UTF8
        
        Write-Host "Reports generated:"
        Write-Host "  - Text: $reportPath"
        Write-Host "  - Markdown: $markdownPath"
        Write-Host "  - JSON: $jsonPath"
      pwsh: true
    condition: always()

  - task: PublishBuildArtifacts@1
    displayName: 'Publish API Compatibility Report'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/ApiCompatReport'
      ArtifactName: 'ApiCompatReport'
      publishLocation: 'Container'
    condition: always()

  - task: PowerShell@2
    displayName: 'Display Results Summary'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host ""
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "API Compatibility Check Complete" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host ""
        Write-Host "Baseline Version: ${{ parameters.BaselineVersion }}" -ForegroundColor Yellow
        Write-Host "Strict Mode: ${{ parameters.StrictMode }}" -ForegroundColor Yellow
        Write-Host ""
        
        if ($env:AGENT_JOBSTATUS -eq 'Succeeded' -or $env:AGENT_JOBSTATUS -eq 'SucceededWithIssues') {
            Write-Host "✅ No breaking API changes detected" -ForegroundColor Green
        } else {
            Write-Host "⚠️ API compatibility issues found" -ForegroundColor Yellow
            Write-Host "Review the logs above for details" -ForegroundColor Yellow
        }
        
        Write-Host ""
        Write-Host "For more information, see:" -ForegroundColor Gray
        Write-Host "  - docs/compatibility-testing/API-CHANGES.md" -ForegroundColor Gray
        Write-Host "  - Microsoft.Azure.Cosmos.Encryption.Custom/ApiCompatSuppressions.txt" -ForegroundColor Gray
        Write-Host ""
      pwsh: true
    condition: always()
