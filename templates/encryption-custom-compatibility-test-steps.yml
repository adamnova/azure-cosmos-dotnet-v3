# Reusable steps template for running compatibility tests against a specific version
parameters:
  - name: BuildConfiguration
    type: string
    default: 'Release'
  - name: TestVersion
    type: string
    default: ''

steps:
  - checkout: self
    clean: true
    displayName: 'Checkout Source'

  - task: UseDotNet@2
    displayName: 'Use .NET 6.0'
    inputs:
      packageType: 'runtime'
      version: '6.x'

  - task: UseDotNet@2
    displayName: 'Use .NET 8.0 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.x'

  - task: PowerShell@2
    displayName: 'Display Test Configuration'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "Compatibility Test Configuration" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "Testing Against Version: ${{ parameters.TestVersion }}" -ForegroundColor Yellow
        Write-Host "Build Configuration: ${{ parameters.BuildConfiguration }}" -ForegroundColor Yellow
        Write-Host "Agent: $(Agent.Name)" -ForegroundColor Gray
        Write-Host "========================================" -ForegroundColor Cyan

  - task: Cache@2
    displayName: 'Cache NuGet packages'
    inputs:
      key: 'nuget | "$(Agent.OS)" | **/packages.lock.json,**/Directory.Packages.props'
      restoreKeys: |
        nuget | "$(Agent.OS)"
        nuget
      path: $(Pipeline.Workspace)/.nuget/packages
    continueOnError: true

  - task: DotNetCoreCLI@2
    displayName: 'Restore NuGet Packages'
    inputs:
      command: 'restore'
      projects: 'Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/*.csproj'
      feedsToUse: 'config'
      nugetConfigPath: 'NuGet.config'
      arguments: '-p:TargetEncryptionCustomVersion=${{ parameters.TestVersion }}'
      verbosityRestore: 'Minimal'

  - task: DotNetCoreCLI@2
    displayName: 'Build Compatibility Tests'
    inputs:
      command: 'build'
      projects: 'Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/*.csproj'
      arguments: '--configuration ${{ parameters.BuildConfiguration }} --no-restore -p:TargetEncryptionCustomVersion=${{ parameters.TestVersion }}'

  - task: DotNetCoreCLI@2
    displayName: 'Run Compatibility Tests (Version: ${{ parameters.TestVersion }})'
    inputs:
      command: 'test'
      projects: 'Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/*.csproj'
      arguments: >
        --configuration ${{ parameters.BuildConfiguration }}
        --no-build
        --no-restore
        --logger "trx;LogFileName=compatibility-${{ parameters.TestVersion }}.trx"
        --logger "console;verbosity=normal"
        --results-directory $(Build.ArtifactStagingDirectory)/TestResults
        -p:TargetEncryptionCustomVersion=${{ parameters.TestVersion }}
    continueOnError: false

  - task: PowerShell@2
    displayName: 'Run API Compatibility Analysis'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "API Compatibility Analysis" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        
        # Install ApiCompat tool if not already installed
        $toolInstalled = dotnet tool list --global | Select-String "microsoft.dotnet.apicompat.tool"
        if (-not $toolInstalled) {
            Write-Host "Installing Microsoft.DotNet.ApiCompat.Tool..." -ForegroundColor Yellow
            dotnet tool install --global Microsoft.DotNet.ApiCompat.Tool --version 8.0.* 2>&1 | Out-Null
        }
        
        # Create output directory for compatibility reports
        $reportDir = "$(Build.ArtifactStagingDirectory)/CompatibilityReports"
        New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
        
        # Download baseline package
        $packagesDir = ".\packages-temp-compat"
        $tempCsproj = "$packagesDir\temp.csproj"
        
        if (Test-Path $packagesDir) {
            Remove-Item $packagesDir -Recurse -Force
        }
        New-Item -ItemType Directory -Path $packagesDir -Force | Out-Null
        
        # Create temporary project to download the baseline package
        @"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>netstandard2.0</TargetFramework>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Microsoft.Azure.Cosmos.Encryption.Custom" Version="${{ parameters.TestVersion }}" />
          </ItemGroup>
        </Project>
        "@ | Out-File $tempCsproj -Encoding UTF8
        
        Write-Host "Downloading baseline package ${{ parameters.TestVersion }}..." -ForegroundColor Yellow
        dotnet restore $tempCsproj --packages $packagesDir\packages 2>&1 | Out-Null
        
        # Locate assemblies
        $currentDll = "Microsoft.Azure.Cosmos.Encryption.Custom\src\bin\${{ parameters.BuildConfiguration }}\netstandard2.0\Microsoft.Azure.Cosmos.Encryption.Custom.dll"
        $baselineDir = Get-ChildItem -Path "$packagesDir\packages\microsoft.azure.cosmos.encryption.custom" -Directory | 
                       Where-Object { $_.Name -eq "${{ parameters.TestVersion }}" } | 
                       Select-Object -First 1 -ExpandProperty FullName
        $baselineDll = "$baselineDir\lib\netstandard2.0\Microsoft.Azure.Cosmos.Encryption.Custom.dll"
        
        if ((Test-Path $currentDll) -and (Test-Path $baselineDll)) {
            Write-Host "Running apicompat analysis..." -ForegroundColor Yellow
            Write-Host "  Current:  $currentDll" -ForegroundColor Gray
            Write-Host "  Baseline: $baselineDll" -ForegroundColor Gray
            
            # Run apicompat and capture output
            $reportFile = "$reportDir/apicompat-${{ parameters.TestVersion }}.txt"
            
            $compatOutput = & apicompat --left $currentDll --right $baselineDll 2>&1
            $compatExitCode = $LASTEXITCODE
            
            # Generate detailed report
            $report = @"
        API Compatibility Report
        ========================
        Test Version: ${{ parameters.TestVersion }}
        Build Configuration: ${{ parameters.BuildConfiguration }}
        Build Number: $(Build.BuildNumber)
        Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
        
        Status: $(if ($compatExitCode -eq 0) { 'PASSED - No breaking changes' } else { 'FAILED - Breaking changes detected' })
        
        Current Assembly: $currentDll
        Baseline Assembly: $baselineDll
        
        ========================
        ApiCompat Output:
        ========================
        
        $($compatOutput -join "`n")
        
        ========================
        
        $(if ($compatExitCode -eq 0) {
            "✅ The current build is API-compatible with version ${{ parameters.TestVersion }}"
        } else {
            "❌ Breaking API changes detected compared to version ${{ parameters.TestVersion }}"
        })
        
        Generated by: Azure DevOps Pipeline - Compatibility Testing
        "@
            
            $report | Out-File $reportFile -Encoding UTF8
            
            Write-Host ""
            if ($compatExitCode -eq 0) {
                Write-Host "✅ API Compatibility: PASSED" -ForegroundColor Green
            } else {
                Write-Host "⚠️ API Compatibility: ISSUES FOUND" -ForegroundColor Yellow
                Write-Host "See detailed report for analysis" -ForegroundColor Yellow
            }
            
            # Create summary for pipeline
            $summaryFile = "$reportDir/summary-${{ parameters.TestVersion }}.md"
            $summaryMd = @"
        # API Compatibility Report - v${{ parameters.TestVersion }}
        
        **Status:** $(if ($compatExitCode -eq 0) { '✅ PASSED' } else { '❌ FAILED' })  
        **Build:** $(Build.BuildNumber)  
        **Date:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
        
        ## Summary
        
        $(if ($compatExitCode -eq 0) {
            "No breaking API changes detected when comparing current build against version ${{ parameters.TestVersion }}."
        } else {
            "⚠️ **Breaking API changes detected!**`n`nThe current build introduces changes that may break compatibility with version ${{ parameters.TestVersion }}. Review the detailed report for specific changes."
        })
        
        ## Details
        
        - **Baseline Version:** ${{ parameters.TestVersion }}
        - **Current Assembly:** ``$currentDll``
        - **Baseline Assembly:** ``$baselineDll``
        
        ## ApiCompat Analysis
        
        ``````
        $($compatOutput -join "`n")
        ``````
        
        ---
        *Generated by Azure DevOps Compatibility Testing Pipeline*
        "@
            
            $summaryMd | Out-File $summaryFile -Encoding UTF8
            
        } else {
            Write-Host "⚠️ Could not locate assemblies for comparison" -ForegroundColor Yellow
            Write-Host "  Current DLL exists: $(Test-Path $currentDll)" -ForegroundColor Gray
            Write-Host "  Baseline DLL exists: $(Test-Path $baselineDll)" -ForegroundColor Gray
        }
        
        # Cleanup
        Remove-Item $packagesDir -Recurse -Force -ErrorAction SilentlyContinue
        
        Write-Host "========================================" -ForegroundColor Cyan
      pwsh: true
    continueOnError: true
    condition: always()

  - task: PublishBuildArtifacts@1
    displayName: 'Publish API Compatibility Reports'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/CompatibilityReports'
      ArtifactName: 'CompatibilityReports-${{ parameters.TestVersion }}'
      publishLocation: 'Container'
    condition: always()

  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Build.ArtifactStagingDirectory)/TestResults'
      mergeTestResults: false
      testRunTitle: 'Compatibility Tests - ${{ parameters.TestVersion }}'
      failTaskOnFailedTests: true
    condition: always()

  - task: PowerShell@2
    displayName: 'Display Package Resolution'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "Package Resolution Details" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        
        $projectPath = "Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests.csproj"
        dotnet list $projectPath package | Where-Object { $_ -match "Microsoft.Azure.Cosmos" }
        
        Write-Host "========================================" -ForegroundColor Cyan
    condition: always()
