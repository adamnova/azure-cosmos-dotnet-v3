name: Encryption.Custom Compatibility Tests

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'Microsoft.Azure.Cosmos.Encryption.Custom/**'
      - '.github/workflows/encryption-custom-compatibility.yml'
  push:
    branches:
      - master
      - main
    paths:
      - 'Microsoft.Azure.Cosmos.Encryption.Custom/**'
  schedule:
    # Run daily at 2:00 AM UTC for comprehensive version matrix
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Specific version to test (leave empty for baseline)'
        required: false
        type: string
      version_matrix:
        description: 'Comma-separated list of versions for full matrix (e.g., "1.0.0-preview07,1.0.0-preview06")'
        required: false
        type: string
      baseline_version:
        description: 'Override baseline version for quick check'
        required: false
        type: string
        default: '1.0.0-preview07'

env:
  BASELINE_VERSION: '1.0.0-preview07'
  DOTNET_VERSION: '8.0.x'
  # Default version matrix (override via workflow_dispatch inputs)
  DEFAULT_VERSION_MATRIX: '["1.0.0-preview07","1.0.0-preview06","1.0.0-preview05","1.0.0-preview04"]'

jobs:
  # Quick check for PRs - only test baseline version
  quick-check:
    name: Quick Check (Baseline)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Create artifacts directory (prevent NuGet restore errors)
        run: mkdir -p artifacts/local-packages
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Display test configuration
        run: |
          echo "========================================="
          echo "Compatibility Test Configuration"
          echo "========================================="
          echo "Testing Against Version: ${{ github.event.inputs.baseline_version || '1.0.0-preview07' }}"
          echo "Runner: ${{ runner.os }}"
          echo "========================================="
      
      - name: Restore dependencies
        run: |
          dotnet restore Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests.csproj
      
      - name: Build compatibility tests
        run: |
          dotnet build Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests.csproj \
            --configuration Release \
            --no-restore \
            -p:TargetEncryptionCustomVersion=${{ github.event.inputs.baseline_version || '1.0.0-preview07' }}
      
      - name: Run compatibility tests
        run: |
          dotnet test Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --logger "trx;LogFileName=compatibility-${{ github.event.inputs.baseline_version || '1.0.0-preview07' }}.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./TestResults \
            -p:TargetEncryptionCustomVersion=${{ github.event.inputs.baseline_version || '1.0.0-preview07' }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-baseline
          path: ./TestResults/*.trx
          retention-days: 30
      
      - name: Display package resolution
        if: always()
        run: |
          echo "========================================="
          echo "Package Resolution Details"
          echo "========================================="
          dotnet list Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests.csproj package | grep -i cosmos || true

  # Full matrix test - runs on schedule or manual trigger
  prepare-matrix:
    name: Prepare Version Matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    
    steps:
      - name: Set version matrix
        id: set-matrix
        run: |
          if [ -n "${{ github.event.inputs.version_matrix }}" ]; then
            # Convert comma-separated input to JSON array
            IFS=',' read -ra VERSIONS <<< "${{ github.event.inputs.version_matrix }}"
            MATRIX_JSON="["
            for i in "${!VERSIONS[@]}"; do
              VERSION=$(echo "${VERSIONS[$i]}" | xargs) # trim whitespace
              if [ $i -gt 0 ]; then MATRIX_JSON+=","; fi
              MATRIX_JSON+="\"$VERSION\""
            done
            MATRIX_JSON+="]"
            echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
            echo "Using custom version matrix: $MATRIX_JSON"
          else
            # Use default matrix
            echo "matrix=$DEFAULT_VERSION_MATRIX" >> $GITHUB_OUTPUT
            echo "Using default version matrix: $DEFAULT_VERSION_MATRIX"
          fi
        env:
          DEFAULT_VERSION_MATRIX: ${{ env.DEFAULT_VERSION_MATRIX }}

  full-matrix:
    name: Test v${{ matrix.version }}
    needs: prepare-matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Create artifacts directory (prevent NuGet restore errors)
        run: mkdir -p artifacts/local-packages
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ matrix.version }}-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.version }}-
            ${{ runner.os }}-nuget-
      
      - name: Display test configuration
        run: |
          echo "========================================="
          echo "Compatibility Test Configuration"
          echo "========================================="
          echo "Testing Against Version: ${{ matrix.version }}"
          echo "Runner: ${{ runner.os }}"
          echo "========================================="
      
      - name: Restore dependencies
        run: |
          dotnet restore Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests.csproj
      
      - name: Build compatibility tests
        run: |
          dotnet build Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests.csproj \
            --configuration Release \
            --no-restore \
            -p:TargetEncryptionCustomVersion=${{ matrix.version }}
      
      - name: Run compatibility tests
        run: |
          dotnet test Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --logger "trx;LogFileName=compatibility-${{ matrix.version }}.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./TestResults \
            -p:TargetEncryptionCustomVersion=${{ matrix.version }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.version }}
          path: ./TestResults/*.trx
          retention-days: 30
      
      - name: Display package resolution
        if: always()
        run: |
          echo "========================================="
          echo "Package Resolution Details"
          echo "========================================="
          dotnet list Microsoft.Azure.Cosmos.Encryption.Custom/tests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests/Microsoft.Azure.Cosmos.Encryption.Custom.CompatibilityTests.csproj package | grep -i cosmos || true

  # Summary job - aggregates results
  test-summary:
    name: Test Summary
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: [full-matrix]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: ./all-results
      
      - name: Display summary
        run: |
          echo "========================================="
          echo "Compatibility Test Summary"
          echo "========================================="
          echo ""
          echo "Test results downloaded to ./all-results/"
          ls -R ./all-results/ || true
          echo ""
          echo "✅ Full matrix compatibility test complete"
          echo "========================================="
